# Hugo configuration file
title: Glory

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Articles
      pageRef: /articles
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: Search
      weight: 4
      params:
        type: search
    - name: Discord
      weight: 6
      url: "https://discordapp.com/users/854590763157684265"
      params:
        icon: discord
    - name: GitHub
      weight: 5
      url: "https://github.com/gloryrunner"
      params:
        icon: github
    - name: Email
      weight: 7
      url: "mailto:gloryrunner1@protonmail.com"
      params:
        icon: mail
    - name: PGP
      weight: 8
      url: "https://keys.openpgp.org/vks/v1/by-fingerprint/15F9D3AC2840752E8EECEE49E6B4A4820E529054"
      params:
        icon: key

params:
  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: false
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/GloryRunner/gloryrunner.github.io/edit/main/content"
